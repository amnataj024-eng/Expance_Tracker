<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f4;
    --surface: #ffffff;
    --ink: #14212b;
    --muted: #5d6c78;
    --line: #d5dde2;
    --accent: #0f766e;
    --accent-dark: #0b5a54;
    --danger: #b42318;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "DM Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .summary { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat {
    flex: 1 1 200px;
    background: var(--ink);
    color: #fff;
    border-radius: var(--radius);
    padding: 16px 20px;
  }
  .stat span { display: block; font-size: .85rem; color: #b7c4cd; }
  .stat strong { font-size: 1.7rem; font-variant-numeric: tabular-nums; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; font-weight: 500; }
  input, select {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid #7cc7bf;
    outline-offset: 1px;
  }
  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
  }
  .add { background: var(--accent); color: #fff; }
  .add:hover { background: var(--accent-dark); }
  .add:disabled { opacity: .6; cursor: wait; }
  .del { background: transparent; color: var(--danger); border: 1px solid #efc4c0; padding: 6px 12px; }
  .del:hover { background: #fdeceb; }
  #message { min-height: 1.4em; margin: 10px 0 0; font-size: .9rem; color: var(--danger); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: .85rem; color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
</style>
</head>
<body>
<main>
  <h1>Personal Expense Tracker</h1>
  <p class="sub">Add what you spend, and see where the money goes.</p>

  <section class="summary" aria-label="Summary">
    <div class="stat"><span>Total expenses</span><strong id="count">0</strong></div>
    <div class="stat"><span>Total amount spent</span><strong id="total">0.00</strong></div>
  </section>

  <section class="card">
    <form id="expense-form">
      <label>Expense title
        <input id="title" type="text" placeholder="e.g. Lunch" required maxlength="80">
      </label>
      <label>Amount
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
      </label>
      <label>Category
        <select id="category" required>
          <option>Food</option>
          <option>Travel</option>
          <option>Shopping</option>
          <option>Bills</option>
          <option>Other</option>
        </select>
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
      <button class="add" id="add-btn" type="submit">Add Expense</button>
    </form>
    <p id="message" role="alert"></p>
  </section>

  <section class="card table-wrap">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Date</th>
          <th class="num">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="empty">Loading expenses…</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc,
    onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // 1) Paste your own Firebase web app config here
  //    (Firebase console → Project settings → Your apps → Web app → Config)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const expensesRef = collection(db, "expenses");

  const form = document.getElementById("expense-form");
  const rows = document.getElementById("rows");
  const message = document.getElementById("message");
  const addBtn = document.getElementById("add-btn");
  const dateInput = document.getElementById("date");

  const money = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function today() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  dateInput.value = today();

  // Add expense
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    message.textContent = "";
    const title = document.getElementById("title").value.trim();
    const amount = parseFloat(document.getElementById("amount").value);
    const category = document.getElementById("category").value;
    const date = dateInput.value;

    if (!title || !(amount > 0) || !date) {
      message.textContent = "Enter a title, an amount above 0, and a date.";
      return;
    }

    addBtn.disabled = true;
    try {
      await addDoc(expensesRef, { title, amount, category, date, createdAt: serverTimestamp() });
      form.reset();
      dateInput.value = today();
    } catch (err) {
      console.error(err);
      message.textContent = "Could not save the expense. Check your Firebase config and Firestore rules.";
    } finally {
      addBtn.disabled = false;
    }
  });

  // Live list, newest date first
  const q = query(expensesRef, orderBy("date", "desc"));
  onSnapshot(q, (snapshot) => {
    rows.innerHTML = "";
    let total = 0;

    if (snapshot.empty) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 5;
      td.className = "empty";
      td.textContent = "No expenses yet. Add your first one above.";
      tr.appendChild(td);
      rows.appendChild(tr);
    }

    snapshot.forEach((d) => {
      const e = d.data();
      total += Number(e.amount) || 0;

      const tr = document.createElement("tr");
      const cells = [e.title, e.category, e.date];
      cells.forEach((text) => {
        const td = document.createElement("td");
        td.textContent = text;
        tr.appendChild(td);
      });

      const amt = document.createElement("td");
      amt.className = "num";
      amt.textContent = money.format(Number(e.amount) || 0);
      tr.appendChild(amt);

      const action = document.createElement("td");
      action.className = "num";
      const btn = document.createElement("button");
      btn.className = "del";
      btn.type = "button";
      btn.textContent = "Delete";
      btn.setAttribute("aria-label", "Delete " + e.title);
      btn.addEventListener("click", async () => {
        try {
          await deleteDoc(doc(db, "expenses", d.id));
        } catch (err) {
          console.error(err);
          message.textContent = "Could not delete the expense.";
        }
      });
      action.appendChild(btn);
      tr.appendChild(action);

      rows.appendChild(tr);
    });

    document.getElementById("count").textContent = snapshot.size;
    document.getElementById("total").textContent = money.format(total);
  }, (err) => {
    console.error(err);
    rows.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5;
    td.className = "empty";
    td.textContent = "Could not load expenses. Check your Firebase config and Firestore rules.";
    tr.appendChild(td);
    rows.appendChild(tr);
  });
</script>
</body>
</html>
